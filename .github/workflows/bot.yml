name: saqi-md-bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: saqi-md-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        run: npm install --no-audit --no-fund && npm install --no-audit --no-fund localtunnel
      - name: run bot + pairing website
        env:
          MONGODB_URI: ""
          PORT: "3000"
          BOT_NAME: ${{ secrets.BOT_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OWNER_NUMBERS: ${{ secrets.OWNER_NUMBERS }}
        run: |
          node worker.js &
          BOT=$!
          sleep 25
          node scripts/tunnel.js &
          TUN=$!
          timeout 20600 tail --pid=$BOT -f /dev/null || true
          kill $TUN 2>/dev/null || true
