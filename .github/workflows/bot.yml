name: saqi-md-bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: saqi-md-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        run: |
          npm install --no-audit --no-fund
          curl -sL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version
      - name: run bot + pairing website
        env:
          MONGODB_URI: ""
          PORT: "3000"
          BOT_NAME: ${{ secrets.BOT_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OWNER_NUMBERS: ${{ secrets.OWNER_NUMBERS }}
        run: |
          node worker.js &
          BOT=$!
          sleep 25
          cloudflared tunnel --url http://localhost:3000 --no-autoupdate > /tmp/cf.log 2>&1 &
          TUN=$!
          sleep 15
          grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1 | sed 's/^/[PAIR-URL] /' || echo '[PAIR-URL] nahi bana'
          timeout 20500 tail --pid=$BOT -f /dev/null || true
          kill $TUN 2>/dev/null || true
